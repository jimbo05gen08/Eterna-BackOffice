<div
  style="
    height: calc(100vh - 80px);
    padding: 20px;
    background-color: #073620;
    display: flex;
    justify-content: center;
  "
>
  <div style="display: flex">
    <p-panelMenu [model]="items" styleClass="w-full text-white">
      <ng-template #item let-item>
        <a
          class="flex items-center px-3 py-2 cursor-pointer hover:bg-transparent hover:text-green-500 transition-colors duration-200"
        >
          <span [class]="item.icon" class="text-white"></span> @if (showLabels)
          { <span class="text-white ml-2">{{ item.label }}</span> }
        </a>
      </ng-template>
    </p-panelMenu>
    <!-- Botón de toggle -->
  </div>
</div>
