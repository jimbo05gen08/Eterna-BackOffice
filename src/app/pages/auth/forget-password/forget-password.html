<div style="width: 100%; height: 100vh; display: flex">
  <div
    class="container1 bg-surface-0 dark:bg-surface-900"
    style="
      width: 40%;
      height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
    "
  >
    <button
      type="button"
      class="layout-topbar-action"
      (click)="toggleDarkMode()"
      style="
        position: absolute;
        top: 2rem;
        left: 2rem;
        z-index: 10;
        cursor: pointer;
        border: none;
        background: transparent;
      "
    >
      <i
        [ngClass]="{ 'pi ': true, 'pi-moon': layoutService.isDarkTheme(), 'pi-sun': !layoutService.isDarkTheme() }"
        style="font-size: 1.5rem"
      ></i>
    </button>

    <div
      style="
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      "
    >
      <div class="flex flex-col items-center justify-center">
        <div
          style="
            max-width: 470px;
            border-radius: 56px;
            padding: 0.3rem;
            background: linear-gradient(
              180deg,
              #073620 10%,
              rgba(33, 150, 243, 0) 30%
            );
            box-shadow: 0px 5px 20px 0px rgba(black, 0.02) !important;
          "
        >
          <div
            class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20"
            style="border-radius: 53px"
          >
            <div class="text-center mb-8">
              <img
                style="display: block; margin: 0 auto"
                src="group.png"
                alt=""
              />
              <div class="text-surface-900 text-2xl font-medium my-4">
                Bienvenido a Eterna BackOffice
              </div>
              <h5
                class="text-muted-color font-medium"
                style="font-weight: bold; color: rgb(87, 86, 86)"
              >
                Restablecimiento de contraseña
              </h5>
            </div>
            <div>
              <label
                for="email1"
                class="block text-surface-900 mb-2"
                style="color: rgb(88, 88, 88)"
                >Por favor ingrese su dirección de correo y recibira
                instrucciones para resetear su contraseña</label
              >
              <input
                pInputText
                id="email1"
                type="text"
                placeholder="Email address"
                class="w-full mb-4"
                [(ngModel)]="email"
              />
              <p-toast />
              <button
                pButton
                label="Restablecer contraseña"
                class="w-full"
                style="color: white"
                (click)="resetPassword()"
              ></button>

              <div class="flex justify-center items-center mt-4 mb-8 gap-2">
                <span
                  class="font-medium no-underline ml-2 text-right text-primary"
                  >¿Conoce su contraseña?</span
                >
                <a
                  routerLink="/auth/login"
                  style="color: green; font-weight: bold"
                >
                  Ingresar
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div
    class="container2"
    style="
      width: 60%;
      height: 100vh;
      background-image: url(https://wallpapercave.com/wp/wp3201178.jpg);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    "
  >
    <div
      style="
        width: 100%;
        height: 110px;
        display: flex;
        justify-content: end;
        padding: 20px;
      "
    >
      <div
        style="
          width: 200px;
          height: 80px;
          background-color: white;
          border-radius: 10px;
          display: flex;
          justify-content: center;
          align-items: center;
        "
      >
        <img src="logo_verde.svg" alt="" width="150px" />
      </div>
    </div>
    <div
      style="
        width: 100%;
        height: calc(100vh - 110px);
        display: flex;
        justify-content: end;
        align-items: end;
        padding: 20px;
      "
    >
      <h1 style="color: white; font-weight: bold; font-size: xx-large">
        "Recuerdos preciados que jamás olvidaremos "
      </h1>
    </div>
  </div>
</div>
