<app-auth-layout
  title="Bienvenido a Eterna BackOffice"
  subtitle="Restablecimiento de contraseña"
>
  <label
    for="email1"
    class="block text-surface-900 mb-2"
    style="color: rgb(88, 88, 88)"
  >
    Por favor ingrese su dirección de correo y recibira instrucciones para
    resetear su contraseña
  </label>
  <input
    pInputText
    id="email1"
    type="text"
    placeholder="Email address"
    class="w-full mb-4"
    [(ngModel)]="email"
  />
  <p-toast />
  <button
    pButton
    label="Restablecer contraseña"
    class="w-full"
    style="color: white"
    [loading]="loading"
    (click)="resetPassword()"
  ></button>

  <div class="flex justify-center items-center mt-4 mb-8 gap-2">
    <span class="font-medium no-underline ml-2 text-right text-primary"
      >¿Conoce su contraseña?</span
    >
    <a routerLink="/auth/login" style="color: green; font-weight: bold">
      Ingresar
    </a>
  </div>
</app-auth-layout>
